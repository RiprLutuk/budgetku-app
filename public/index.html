<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d2732" />
  <meta name="description" content="BudgetKu Family — dashboard keuangan keluarga yang compact dan kolaboratif." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/app.css" />
  <title>BudgetKu Family</title>
</head>
<body>
  <div id="authScreen" class="auth-screen hidden"></div>
  <div id="shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><img src="/favicon.svg" alt="" class="brand-mark"><div><b>BudgetKu</b><small>Family money tracker</small></div></div>
      <nav aria-label="Navigasi utama">
        <button data-view="dashboard" class="nav active"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button data-view="transactions" class="nav"><span class="nav-icon">↕</span><span>Transaksi</span></button>
        <button data-view="budget" class="nav"><span class="nav-icon">◫</span><span><span class="nav-desktop-label">Auto </span>Budget</span></button>
        <button data-view="goals" class="nav"><span class="nav-icon">◎</span><span>Tabungan</span></button>
        <button type="button" class="nav-more" aria-label="Buka menu lainnya" aria-haspopup="dialog" aria-controls="moreDialog" aria-expanded="false"><span class="nav-icon"></span><span>Lainnya</span></button>
        <button data-view="receipts" class="nav nav-secondary"><span class="nav-icon">▤</span><span>Nota & Gmail</span></button>
        <button data-view="family" class="nav nav-secondary"><span class="nav-icon">♧</span><span>Keluarga</span></button>
        <button data-view="users" class="nav admin-only nav-secondary hidden"><span class="nav-icon">♙</span><span>Kelola User</span></button>
        <button data-view="settings" class="nav nav-secondary"><span class="nav-icon">⚙</span><span>Pengaturan</span></button>
      </nav>
      <div class="side-note" id="userMini"></div>
    </aside>

    <main>
      <div id="pageTools" class="page-tools">
        <div class="page-tools-title">
          <span class="page-tools-kicker">BUDGETKU FAMILY</span>
          <h1 id="pageTitle" tabindex="-1">Dashboard</h1>
        </div>
        <div class="page-tools-actions">
          <div id="monthControl" class="month-control">
            <button id="monthPickerTrigger" class="month-picker-trigger" type="button" aria-haspopup="dialog" aria-controls="monthDialog"><span>Memuat bulan</span></button>
            <input id="monthPicker" class="month-picker-input sr-only" type="month" tabindex="-1" aria-hidden="true" />
          </div>
          <button id="togglePrivacy" class="icon-btn privacy-toggle" type="button" aria-label="Sembunyikan nominal" aria-pressed="false" title="Sembunyikan nominal"></button>
          <button id="refreshData" class="icon-btn page-refresh-btn" type="button" aria-label="Perbarui data" title="Perbarui data"></button>
          <button id="quickAdd" class="primary icon-label" aria-label="Catat transaksi"><span class="button-icon">＋</span><span class="hide-compact">Transaksi</span></button>
        </div>
      </div>
      <section id="app"></section>
    </main>
  </div>

  <div id="pullRefresh" class="pull-refresh" role="status" aria-live="polite" aria-atomic="true" data-state="idle" hidden>
    <span class="pull-refresh-ring" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10a7.5 7.5 0 0 0-13.6-3.8L4 8"/><path d="M4 4v4h4"/><path d="M5 14a7.5 7.5 0 0 0 13.6 3.8L20 16"/><path d="M20 20v-4h-4"/></svg></span>
    <span class="sr-only" data-pull-label>Tarik untuk memperbarui</span>
  </div>

  <dialog id="moreDialog" class="more-dialog" aria-labelledby="moreDialogTitle">
    <div class="more-sheet">
      <div class="more-sheet-head">
        <div><h2 id="moreDialogTitle">Lainnya</h2></div>
        <button type="button" class="icon-btn more-close" aria-label="Tutup menu" title="Tutup menu" data-icon="close"></button>
      </div>
      <nav class="more-nav-list" aria-label="Menu lainnya">
        <button data-view="receipts" class="nav more-nav"><span class="nav-icon"></span><span>Nota & Gmail</span><span class="more-nav-arrow" aria-hidden="true"></span></button>
        <button data-view="family" class="nav more-nav"><span class="nav-icon"></span><span>Keluarga</span><span class="more-nav-arrow" aria-hidden="true"></span></button>
        <button data-view="users" class="nav admin-only more-nav hidden"><span class="nav-icon"></span><span>Kelola User</span><span class="more-nav-arrow" aria-hidden="true"></span></button>
        <button data-view="settings" class="nav more-nav"><span class="nav-icon"></span><span>Pengaturan</span><span class="more-nav-arrow" aria-hidden="true"></span></button>
      </nav>
      <div class="more-account" id="moreUser"></div>
    </div>
  </dialog>

  <dialog id="monthDialog" class="month-dialog" aria-labelledby="monthDialogTitle">
    <section class="month-sheet">
      <div class="month-sheet-handle" aria-hidden="true"></div>
      <header class="month-sheet-head"><h2 id="monthDialogTitle">Pilih periode</h2><button id="monthDialogClose" class="icon-btn" type="button" aria-label="Tutup pilihan bulan">×</button></header>
      <div class="month-wheel-picker" aria-label="Pilih bulan dan tahun"><section><span>Bulan</span><select id="monthWheelMonths" class="month-wheel" aria-label="Bulan"></select><svg class="month-wheel-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"/></svg></section><section><span>Tahun</span><select id="monthWheelYears" class="month-wheel" aria-label="Tahun"></select><svg class="month-wheel-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"/></svg></section></div>
      <div class="month-sheet-actions"><button id="monthDialogToday" class="secondary" type="button">Bulan ini</button><button id="monthDialogApply" class="primary" type="button">Pakai periode</button></div>
    </section>
  </dialog>

  <dialog id="txDialog" aria-labelledby="txDialogTitle">
    <form method="dialog" id="txForm" class="dialog-card form-stack" novalidate>
      <div class="dialog-head">
        <h3 id="txDialogTitle">Tambah transaksi</h3>
        <button value="cancel" type="button" data-dialog-close class="icon-btn" aria-label="Tutup dialog" title="Tutup dialog" data-icon="close"></button>
      </div>
      <div class="segmented" role="group" aria-label="Jenis transaksi">
        <button type="button" data-type="expense" class="type-btn active" aria-pressed="true">Pengeluaran</button>
        <button type="button" data-type="income" class="type-btn" aria-pressed="false">Pemasukan</button>
      </div>
      <p id="txTypeHint" class="transaction-type-hint" role="status" aria-live="polite"></p>
      <input type="hidden" name="type" value="expense" />
      <div class="form-grid transaction-grid">
        <label for="txAmount">Nominal (Rp)<input id="txAmount" name="amount" class="money-input" inputmode="numeric" placeholder="150.000" autocomplete="off" required /></label>
        <label for="txDate">Tanggal<input id="txDate" name="date" type="date" required /></label>
      </div>
      <label for="txNote">Nama / catatan<input id="txNote" name="note" placeholder="Belanja bulanan" maxlength="255" required /></label>
      <div class="form-grid transaction-grid">
        <div class="category-row form-stack"><label for="txCategory">Kategori</label><div id="categorySelect"></div></div>
        <div class="paid-by-row form-stack"><label id="paidByLabel" for="txPaidBy">Dibayar oleh</label><div id="paidBySelect"></div></div>
      </div>
      <div class="asset-row field-choice-card"><label class="check" for="txIsAsset"><input id="txIsAsset" name="isAsset" type="checkbox" /><span>Pembelian besar / aset</span></label><div class="asset-fields form-grid" hidden><label for="txAssetName">Nama aset<input id="txAssetName" name="assetName" maxlength="80" placeholder="Contoh: Lemari pakaian"></label><label for="txAssetType">Jenis aset<select id="txAssetType" name="assetType"><option value="household">Rumah tangga</option><option value="vehicle">Kendaraan</option><option value="electronics">Elektronik</option><option value="property">Properti</option><option value="investment">Investasi</option></select></label></div><span class="field-help">Kas tetap berkurang, tetapi transaksi ini tidak dihitung sebagai kebutuhan atau keinginan.</span></div>
      <div class="goal-allocation-row form-stack"><label for="txGoal">Alokasi tabungan (opsional)</label><div id="goalSelect"></div><span id="goalHint" class="field-help" role="status" aria-live="polite"></span></div>
      <div class="need-row field-choice-card"><label class="check" for="txNeed"><input id="txNeed" name="need" type="checkbox" checked /><span>Kebutuhan, bukan keinginan</span></label></div>
      <input type="hidden" name="source" value="manual" />
      <input type="hidden" name="receiptUrl" />
      <input type="hidden" name="externalRef" />
      <details id="txHistory" class="transaction-history" hidden><summary>Riwayat koreksi</summary><div data-history class="field-help" role="status"></div></details>
      <div class="form-footer">
        <p class="form-message muted" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="txDeleteBtn" type="button" class="danger" hidden>Hapus</button>
          <button type="button" data-dialog-close class="secondary">Batal</button>
          <button id="txSubmitBtn" class="primary" type="submit" value="default"><span data-icon="check"></span><span id="txSubmitLabel">Simpan transaksi</span></button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
