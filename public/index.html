<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#19182a" />
  <meta name="description" content="BudgetKu Family — dashboard keuangan keluarga yang compact dan kolaboratif." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/app.css" />
  <title>BudgetKu Family</title>
</head>
<body>
  <div id="authScreen" class="auth-screen hidden"></div>
  <div id="shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><img src="/favicon.svg" alt="" class="brand-mark"><div><b>BudgetKu</b><small>Family money tracker</small></div></div>
      <div id="householdSwitcher" class="household-switcher"></div>
      <nav>
        <button data-view="dashboard" class="nav active"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button data-view="transactions" class="nav"><span class="nav-icon">↕</span><span>Transaksi</span></button>
        <button data-view="budget" class="nav"><span class="nav-icon">◫</span><span>Auto Budget</span></button>
        <button data-view="goals" class="nav"><span class="nav-icon">◎</span><span>Goals</span></button>
        <button data-view="receipts" class="nav"><span class="nav-icon">▤</span><span>Nota & Gmail</span></button>
        <button data-view="family" class="nav"><span class="nav-icon">♧</span><span>Family</span></button>
        <button data-view="users" class="nav admin-only hidden"><span class="nav-icon">♙</span><span>Kelola User</span></button>
        <button data-view="settings" class="nav"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
      <div class="side-note" id="userMini"></div>
    </aside>
    <button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="Tutup navigasi" tabindex="-1"></button>

    <main>
      <header class="topbar">
        <button id="toggleSidebar" class="icon-btn" aria-label="Buka navigasi" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div><h1 id="pageTitle">Dashboard</h1><p id="monthLabel"></p></div>
        <button id="quickAdd" class="primary icon-label"><span class="button-icon">＋</span><span class="hide-compact">Transaksi</span></button>
      </header>
      <section id="app"></section>
    </main>
  </div>

  <dialog id="txDialog">
    <form method="dialog" id="txForm" class="dialog-card">
      <div class="dialog-head"><div><div class="kicker">Catat cashflow</div><h3>Tambah transaksi</h3></div><button value="cancel" formnovalidate class="icon-btn" aria-label="Tutup dialog" title="Tutup">×</button></div>
      <div class="segmented"><button type="button" data-type="expense" class="type-btn active">Pengeluaran</button><button type="button" data-type="income" class="type-btn">Pemasukan</button></div>
      <input type="hidden" name="type" value="expense" />
      <label>Nominal (Rp)<input name="amount" class="money-input" inputmode="numeric" placeholder="150.000" autocomplete="off" required /></label>
      <label>Nama / catatan<input name="note" placeholder="Belanja bulanan" required /></label>
      <label class="category-row">Kategori<div id="categorySelect" class="search-select" data-name="category"></div></label>
      <label class="goal-allocation-row">Alokasi tabungan / goal (opsional)<div id="goalSelect" class="search-select" data-name="goalId" aria-describedby="goalHint"></div><span id="goalHint" class="small muted field-help"></span></label>
      <label>Tanggal<input name="date" type="date" required /></label>
      <label>Dibayar oleh<div id="paidBySelect" class="search-select" data-name="paidBy"></div></label>
      <label class="check need-row"><input name="need" type="checkbox" checked /> Ini kebutuhan, bukan keinginan</label>
      <input type="hidden" name="source" value="manual" />
      <input type="hidden" name="receiptUrl" />
      <input type="hidden" name="externalRef" />
      <button class="primary wide icon-label" value="default"><span class="button-icon">✓</span><span>Simpan transaksi</span></button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
